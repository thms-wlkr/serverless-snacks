name: CI/CD Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          npm install -g aws-cdk

      - name: Lint with pylint
        run: |
          source .venv/bin/activate
          pylint lib/ src/

      - name: Run unit tests
        run: |
          source .venv/bin/activate
          pytest tests/unit/ src/ -v --cov=lib --cov=src --cov-report=term

      # Integration tests would be added in a separate job that:
      # - Runs only on merge to main (post-deployment)
      # - Runs: pytest tests/integration/ -v
      # - Uses AWS credentials from GitHub Secrets
      # - Or deploys to a test environment
      # - Tears down test environment after completion

      - name: CDK Synth
        run: |
          source .venv/bin/activate
          cdk synth

